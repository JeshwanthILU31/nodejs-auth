name: CI

on:
  push:
    branches:
       - main
jobs:
  test:
     runs-on: ubuntu-latest

     steps:
        - name: Checkout code
          uses: actions/checkout@v6
          
        - name: Setup Node.js
          uses: actions/setup-node@v6
          with:
             node-version: 20     

        - name: Install dependencies
          run: npm install

        - name: Run tests
          run: npm test

        - name: Test Secret
          run: echo "Secret exists: $TEST_SECRET"
          env:
             TEST_SECRET: ${{ secrets.TEST_SECRET }}
