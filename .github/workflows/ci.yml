name: CI

on:
  push:
    branches:
       - main
jobs:
  test:
     runs-on: ubuntu-latest

     steps:
        - name: Checkout code
          uses: actions/checkout@v6
          
        - name: Setup Node.js
          uses: action/setup-node@v6
          with:
             node-version: 20

        - name: Install dependencies
          run: npm install
